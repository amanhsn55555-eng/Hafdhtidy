    <style>

        .payment-info-box{background:#fef3c7;border-radius:14px;padding:12px;margin:10px 0;border:2px solid #fbbf24}

</style>

<body>

<div class="header">
    <div class="back-btn" onclick="history.back()"><i class="fas fa-arrow-right"></i></div>
    <h2><i class="fas fa-wallet"></i> المحفظة</h2>
    <div class="team-btn" onclick="openTeamModal()">
        <i class="fas fa-users"></i>
        <span class="badge" id="teamBadge" style="display:none">0</span>
    </div>
</div>

<div class="container" id="mainContainer">
    <div style="text-align:center;padding:40px;color:#94a3b8"><i class="fas fa-spinner fa-pulse" style="font-size:30px"></i></div>
</div>

<!-- نافذة تأكيد السحب -->
<div class="modal" id="withdrawModal"><div class="modal-box" style="position:relative">
    <button class="close-btn" onclick="closeWithdraw()">&times;</button>
    <h3>💵 تأكيد السحب</h3>
    <div style="text-align:center;padding:20px;background:#fef2f2;border-radius:16px;margin-bottom:12px">
        <div style="font-size:36px;font-weight:800;color:#ef4444" id="wdAmount">0</div>
        <div style="color:#64748b">TMX</div>
    </div>
    <p style="color:#64748b;text-align:center;margin-bottom:8px;font-size:13px">طريقة الاستلام: <strong id="wdMethod"></strong></p>
    <p style="color:#64748b;text-align:center;margin-bottom:8px;font-size:13px" id="wdPaymentInfo"></p>
    <p style="color:#64748b;text-align:center;margin-bottom:8px;font-size:13px">الوكيل: <strong id="wdAgent"></strong></p>
    <button class="btn btn-red" onclick="confirmWithdraw()"><i class="fas fa-check"></i> تأكيد السحب</button>
    <button class="btn" style="background:#f1f5f9;color:#64748b" onclick="closeWithdraw()">إلغاء</button>
</div></div>

<!-- نافذة الوكلاء -->
<div class="modal" id="agentModal"><div class="modal-box" style="position:relative">
    <button class="close-btn" onclick="closeAgents()">&times;</button>
    <h3>🤝 اختر وكيل</h3>
    <div id="agentsList"></div>
    <button class="btn btn-gold" onclick="selectAgent()">تأكيد الاختيار</button>
</div></div>

<!-- نافذة الفريق (الإحالة) -->
<div class="modal" id="teamModal"><div class="modal-box" style="position:relative">
    <button class="close-btn" onclick="closeTeam()">&times;</button>
    <h3>👥 فريقي</h3>
    <div id="teamSummary"></div>
    <div id="teamList"></div>
</div></div>

<!-- نافذة الملف الشخصي الكامل للوكيل -->
<div class="full-profile-overlay" id="agentFullProfile">
    <div class="full-profile-box">
        <button class="full-profile-close" onclick="closeAgentFullProfile()">&times;</button>
        <div id="agentFullProfileContent"></div>
    </div>
</div>

<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, query, where, addDoc, increment, getDocs } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";

const fc={apiKey:"AIzaSyCPBrZMo6IYCwCDYV3HEfNcUmLUITR6VRc",authDomain:"elahbes.firebaseapp.com",projectId:"elahbes",storageBucket:"elahbes.firebasestorage.app",messagingSenderId:"800207969145",appId:"1:800207969145:web:aa19b725d1c92dd48fada8",measurementId:"G-EFT566SJMP"};
const app=initializeApp(fc),auth=getAuth(app),db=getFirestore(app);

// القيم الافتراضية - تتحدث من لوحة التحكم
var RATES={gold:2500,elixir:5000,oil:1000};
var SELL_FEE=0.02;
var MIN_WITHDRAW=500;
var ALLOW_WITHDRAW=true;

let me=null,myData=null,resources={gold:0,elixir:0,money:0,oil:0};
let transactions=[],withdrawRequests=[];
let pendingAmount=0,selectedMethod='',selectedAgent=null,agents=[];
let exchangeMode='buy';
let currentTab='wallet'; // wallet, charge
let paymentInfo={fullName:'',cardNumber:''};
let teamMembers=[], teamTotalWithdrawals=0, teamTotalEarnings=0, teamTotalOilEarnings=0;
let allPosts=[]; // لتخزين جميع المنشورات

function toast(m,ok){ok=ok!==false;var t=document.getElementById('toast');t.textContent=m;t.style.background=ok?'#10b981':'#ef4444';t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2500)}
function fNum(n){return(n||0).toLocaleString('ar-SA')}

// ========== قراءة الإعدادات من لوحة التحكم ==========
async function loadAdminSettings(){
    try{
        var snap;
        snap=await getDoc(doc(db,"admin_settings","rate_gold"));
        if(snap.exists())RATES.gold=snap.data().value;
        
        snap=await getDoc(doc(db,"admin_settings","rate_elixir"));
        if(snap.exists())RATES.elixir=snap.data().value;
        
        snap=await getDoc(doc(db,"admin_settings","rate_oil"));
        if(snap.exists())RATES.oil=snap.data().value;
        
        snap=await getDoc(doc(db,"admin_settings","sell_fee"));
        if(snap.exists())SELL_FEE=snap.data().value;
        
        snap=await getDoc(doc(db,"admin_settings","min_withdraw"));
        if(snap.exists())MIN_WITHDRAW=snap.data().value;
        
        snap=await getDoc(doc(db,"admin_settings","allow_withdraw"));
        if(snap.exists())ALLOW_WITHDRAW=snap.data().value;
        
        console.log('✅ تم تحميل إعدادات المحفظة');
    }catch(e){console.log('⚠️ استخدام الإعدادات الافتراضية')}
}

async function loadData(uid){
    await loadAdminSettings();
    
    var rd=await getDoc(doc(db,"resources",uid));
    resources=rd.exists()?rd.data():{gold:10,elixir:10,money:10000,oil:10};
    if(!rd.exists())await setDoc(doc(db,"resources",uid),resources);
    
    var wd=await getDoc(doc(db,"wallets",uid));
    transactions=wd.exists()?wd.data().transactions||[]:[];
    
    var ud=await getDoc(doc(db,"users",uid));
    myData=ud.exists()?ud.data():{username:'مستخدم',emoji:'😎',userId:uid.slice(0,6),email:''};
    myData.uid=uid;
    
    // تحميل طلبات السحب
    var wq=await getDocs(query(collection(db,"withdraw_requests"),where("uid","==",uid)));
    withdrawRequests=[];
    wq.forEach(function(d){withdrawRequests.push({id:d.id,...d.data()})});
    withdrawRequests.sort(function(a,b){return(b.createdAt||0)-(a.createdAt||0)});
    
    // تحميل الوكلاء
    agents=[];
    for(var e of['w1@1.com','w2@2.com','w3@3.com']){
        var q=await getDocs(query(collection(db,"users"),where("email","==",e)));
        q.forEach(function(d){agents.push({uid:d.id,...d.data()})});
    }
    
    // تحميل جميع المنشورات لعرضها في ملف الوكيل
    try{
        var postsSnap=await getDocs(query(collection(db,"posts")));
        allPosts=[];
        postsSnap.forEach(function(d){allPosts.push({id:d.id,...d.data()})});
    }catch(e){console.log('⚠️ فشل تحميل المنشورات')}
    
    // تحميل فريق الإحالة
    await loadTeamData(uid);
    
    renderMain();
}

// ========== تحميل بيانات فريق الإحالة ==========
async function loadTeamData(uid){
    teamMembers=[];
    teamTotalWithdrawals=0;
    teamTotalEarnings=0;
    teamTotalOilEarnings=0;
    
    try{
        // جلب المستخدمين الذين friendUid = uid الحالي
        var refQ=await getDocs(query(collection(db,"users"),where("friendUid","==",uid)));
        var members=[];
        refQ.forEach(function(d){members.push({uid:d.id,...d.data()})});
        
        if(members.length===0){return;}
        
        for(var m of members){
            // جلب طلبات السحب لهذا العضو
            var wq=await getDocs(query(collection(db,"withdraw_requests"),where("uid","==",m.uid)));
            var totalMemberWithdraw=0;
            var earnedFromMember=0;
            wq.forEach(function(d){
                var w=d.data();
                totalMemberWithdraw+=(w.originalAmount||w.amount||0);
                earnedFromMember+=(w.friendFee||0);
            });
            
            // جلب أرباح النفط من الإحالة لهذا العضو
            var memberResources=await getDoc(doc(db,"resources",m.uid));
            var memberReferralOil=0;
            if(memberResources.exists()){
                memberReferralOil=memberResources.data().referralOil || 0;
            }
            
            // جلب سجل تجميع البئر لمعرفة كم نفط وصل من هذا العضو
            var oilFromMember=0;
            try{
                var oilWellsDoc=await getDoc(doc(db,"oil_wells",m.uid));
                if(oilWellsDoc.exists()){
                    var history=oilWellsDoc.data().collectionHistory||[];
                    history.forEach(function(h){
                        if(h.referralCut && h.referralCut > 0){
                            oilFromMember += h.referralCut;
                        }
                    });
                }
            }catch(e){}
            
            teamTotalWithdrawals+=totalMemberWithdraw;
            teamTotalEarnings+=earnedFromMember;
            teamTotalOilEarnings+=oilFromMember;
            
            teamMembers.push({
                uid:m.uid,
                username:m.username||'مستخدم',
                emoji:m.emoji||'👤',
                avatarType:m.avatarType,
                avatarUrl:m.avatarUrl,
                userId:m.userId||m.uid.slice(0,6),
                totalWithdrawals:totalMemberWithdraw,
                earnedFromMember:earnedFromMember,
                oilFromMember:oilFromMember,
                joinDate:m.createdAt
            });
        }
        
        teamMembers.sort(function(a,b){return (b.earnedFromMember + b.oilFromMember) - (a.earnedFromMember + a.oilFromMember)});
        
        var badge=document.getElementById('teamBadge');
        if(badge){
            badge.textContent=teamMembers.length;
            badge.style.display=teamMembers.length>0?'flex':'none';
        }
    }catch(e){console.log('⚠️ خطأ في تحميل بيانات الفريق:',e)}
}

function renderMain(){
    var c=document.getElementById('mainContainer');

window.updateBuy=function(){var a=+document.getElementById('buyAmt').value||0;document.getElementById('buyPreview').innerHTML=a>0?'💰 '+a+' TMX =<br>🪙 '+fNum(a*RATES.gold)+' ذهب | 🧪 '+fNum(a*RATES.elixir)+' إكسير | 🛢️ '+fNum(a*RATES.oil)+' نفط':'أدخل مبلغاً لرؤية المعادل'};
window.execBuy=async function(type){
    var amt=+document.getElementById('buyAmt').value||0;
    if(amt<1)return toast('أدخل مبلغاً',false);
    if(resources.money<amt)return toast('رصيد غير كاف',false);
    var received=amt*RATES[type];
    var names={gold:'ذهب',elixir:'إكسير',oil:'نفط'};
    try{
        var upd={money:increment(-amt)};upd[type]=increment(received);
        await updateDoc(doc(db,"resources",me.uid),upd);
        resources.money-=amt;resources[type]=(resources[type]||0)+received;
        var tx={type:'buy',spent:amt,spentCurrency:'TMX',received:received,receivedCurrency:names[type],createdAt:Date.now()};
        transactions.push(tx);
        var wd=await getDoc(doc(db,"wallets",me.uid));
        var ts=wd.exists()?wd.data().transactions||[]:[];
        ts.push(tx);await setDoc(doc(db,"wallets",me.uid),{transactions:ts},{merge:true});
        renderMain();toast('✅ تم شراء '+fNum(received)+' '+names[type]);
    }catch(e){toast('❌ فشل',false)}
};

    } else {document.getElementById('sellPreview').innerHTML='أدخل كمية لرؤية العائد'}
};
window.execSell=async function(){
    var type=document.getElementById('sellType').value;
    var amt=+document.getElementById('sellAmt').value||0;
    if(amt<1)return toast('أدخل كمية',false);
    if((resources[type]||0)<amt)return toast('رصيد غير كاف',false);
    var rate=RATES[type]||1;
    var received=Math.floor((amt/rate)*SELL_FEE);
    var names={gold:'ذهب',elixir:'إكسير',oil:'نفط'};
    try{
        var upd={};upd[type]=increment(-amt);upd.money=increment(received);
        await updateDoc(doc(db,"resources",me.uid),upd);
        resources[type]-=amt;resources.money+=received;
        var tx={type:'sell',spent:amt,spentCurrency:names[type],received:received,receivedCurrency:'TMX',createdAt:Date.now()};
        transactions.push(tx);
        var wd=await getDoc(doc(db,"wallets",me.uid));
        var ts=wd.exists()?wd.data().transactions||[]:[];
        ts.push(tx);await setDoc(doc(db,"wallets",me.uid),{transactions:ts},{merge:true});
        renderMain();toast('✅ تم بيع '+fNum(amt)+' '+names[type]+' مقابل '+fNum(received)+' TMX');
    }catch(e){toast('❌ فشل',false)}
};

// ========== سحب ==========
window.setAmt=function(a){document.getElementById('wdAmt').value=a;updateWdBtn()};
window.updateWdBtn=function(){
    var a=+document.getElementById('wdAmt').value||0;
    var m=document.getElementById('wdMethodSel').value;
    var btn=document.getElementById('wdBtn');
    if(btn)btn.disabled=a<MIN_WITHDRAW||a>resources.money||!m||ALLOW_WITHDRAW===false;
};
window.onMethodChange=function(){
    var m=document.getElementById('wdMethodSel').value;
    document.getElementById('agentInfo').style.display=m==='agent'?'block':'none';
    document.getElementById('paymentFields').style.display=(m==='zain'||m==='master')?'block':'none';
    updateWdBtn();
};
window.openAgents=function(){document.getElementById('agentModal').classList.add('show');renderAgents()};
window.closeAgents=function(){document.getElementById('agentModal').classList.remove('show')};
function renderAgents(){
    var html='';
    agents.forEach(function(a){
        html+='<div class="agent-card'+(selectedAgent&&selectedAgent.uid===a.uid?' selected':'')+'" onclick="pickAgent(\''+a.uid+'\')">'+
            '<div class="agent-avatar">'+(a.avatarType==='image'&&a.avatarUrl?'<img src="'+a.avatarUrl+'">':a.emoji||'👤')+'</div>'+
            '<div><strong>'+(a.username||'مستخدم')+'</strong><br><small>'+(a.bio||'وكيل معتمد')+'</small><br><small>📧 '+a.email+'</small></div></div>';
    });
    document.getElementById('agentsList').innerHTML=html||'<p style="color:#94a3b8">لا وكلاء</p>';
}
window.pickAgent=function(uid){selectedAgent=agents.find(function(a){return a.uid===uid});renderAgents()};
window.selectAgent=function(){
    if(!selectedAgent)return toast('اختر وكيلاً',false);
    document.getElementById('agentName').textContent=selectedAgent.username||'وكيل';
    closeAgents();
};
window.openWithdraw=function(){
    var a=+document.getElementById('wdAmt').value||0;
    var m=document.getElementById('wdMethodSel').value;
    if(ALLOW_WITHDRAW===false){toast('🚫 السحب معلق حالياً من قبل الإدارة',false);return}
    if(a<MIN_WITHDRAW||!m)return;
    
    if(m==='zain'||m==='master'){
        var fullName=document.getElementById('fullName').value.trim();
        var cardNumber=document.getElementById('cardNumber').value.trim();
        if(!fullName||!cardNumber){toast('الرجاء إدخال معلومات الدفع كاملة',false);return}
        paymentInfo={fullName:fullName,cardNumber:cardNumber};
    }
    
    pendingAmount=a;selectedMethod=m;
    var mn={zain:'زين كاش',master:'ماستر كارد',agent:'استلام من وكيل'};
    document.getElementById('wdAmount').textContent=fNum(a);
    document.getElementById('wdMethod').textContent=mn[m]||m;
    
    if(m==='zain'||m==='master'){
        document.getElementById('wdPaymentInfo').innerHTML='👤 '+paymentInfo.fullName+' | 💳 '+paymentInfo.cardNumber;
    } else {
        document.getElementById('wdPaymentInfo').textContent='';
    }
    
    document.getElementById('wdAgent').textContent=m==='agent'&&selectedAgent?selectedAgent.username:'-';
    document.getElementById('withdrawModal').classList.add('show');
};
window.closeWithdraw=function(){document.getElementById('withdrawModal').classList.remove('show')};
window.confirmWithdraw=async function(){
    if(!pendingAmount||pendingAmount<MIN_WITHDRAW)return;
    if(pendingAmount>resources.money)return toast('رصيد غير كاف',false);
    try{
        var fp=1,fe=true;
        try{
            var s=await getDoc(doc(db,"admin_settings","friend_fee_percent"));
            if(s.exists())fp=s.data().value;
            s=await getDoc(doc(db,"admin_settings","friend_fee_enabled"));
            if(s.exists())fe=s.data().value;
        }catch(e){}
        
        var ff=0,fu=null,wa=pendingAmount;
        
        var ud=await getDoc(doc(db,"users",me.uid));
        if(ud.exists()){
            var u=ud.data();
            if(u.friendUid&&fe&&fp>0){
                fu=u.friendUid;
                ff=Math.floor(pendingAmount*fp/100);
                if(ff>0){
                    await updateDoc(doc(db,"resources",fu),{money:increment(ff)});
                }
                wa=pendingAmount-ff;
            }
        }
        
        await updateDoc(doc(db,"resources",me.uid),{money:increment(-pendingAmount)});
        resources.money-=pendingAmount;
        
        var req={
            uid:me.uid,userName:myData.username||'مستخدم',userEmoji:myData.emoji||'👤',
            userAvatarType:myData.avatarType,userAvatarUrl:myData.avatarUrl,
            userColors:myData.colors,userEmail:myData.email,
            userId:myData.userId||me.uid.slice(0,6),
            amount:wa,originalAmount:pendingAmount,friendFee:ff,friendUid:fu,
            method:selectedMethod,
            agentId:selectedMethod==='agent'&&selectedAgent?selectedAgent.uid:null,
            agentName:selectedMethod==='agent'&&selectedAgent?selectedAgent.username:null,
            paymentInfo:selectedMethod!=='agent'?paymentInfo:null,
            status:'pending',createdAt:Date.now(),resources:resources
        };
        await addDoc(collection(db,"withdraw_requests"),req);
        
        withdrawRequests.unshift({
            amount:wa,originalAmount:pendingAmount,friendFee:ff,
            method:selectedMethod,status:'pending',createdAt:Date.now(),
            reason:'',paymentInfo:selectedMethod!=='agent'?paymentInfo:null
        });
        
        closeWithdraw();renderMain();
        var msg='📋 تم تقديم طلب السحب';
        if(ff>0)msg+=' ('+fp+'% لصاحب المعرف: '+fNum(ff)+' TMX)';
        toast(msg);
    }catch(e){toast('❌ فشل',false)}
};

document.addEventListener('DOMContentLoaded',function(){
    document.getElementById('wdAmt').addEventListener('input',updateWdBtn);
});

onAuthStateChanged(auth,async function(user){
    if(user){me=user;await loadData(user.uid)}
    else{document.getElementById('mainContainer').innerHTML='<p style="text-align:center;padding:50px;color:#94a3b8">يرجى تسجيل الدخول</p>'}
});

 // ==========================================
// نظام التخزين المؤقت الشامل - المحفظة (مخفي تماماً)
// يشمل: الموارد + بيانات المستخدم + سجل العمليات + الوكلاء + أسعار الصرف
// ==========================================

const CACHE_KEYS = {
    resources: 'wallet_resources_v2',
    userData: 'wallet_user_data_v2',
    transactions: 'wallet_transactions_v2',
    withdrawRequests: 'wallet_withdraw_requests_v2',
    agents: 'wallet_agents_v2',
    rates: 'wallet_rates_v2',
    settings: 'wallet_settings_v2',
    allPosts: 'wallet_all_posts_v2',
    teamData: 'wallet_team_data_v2',
    cacheTimestamp: 'wallet_cache_timestamp_v2'
};

const CACHE_DURATION = 24 * 60 * 60 * 1000; // 24 ساعة كاملة

// ========== دوال التخزين العامة ==========
function saveToCache(key, data) {
    try {
        localStorage.setItem(key, JSON.stringify(data));
        return true;
    } catch (e) {
        return false;
    }
}

function getFromCache(key) {
    try {
        const data = localStorage.getItem(key);
        return data ? JSON.parse(data) : null;
    } catch (e) {
        return null;
    }
}

function removeFromCache(key) {
    localStorage.removeItem(key);
}

function clearAllCache() {
    Object.values(CACHE_KEYS).forEach(key => localStorage.removeItem(key));
}

// التحقق من صلاحية الكاش
function isCacheValid() {
    const timestamp = getFromCache(CACHE_KEYS.cacheTimestamp);
    if (!timestamp) return false;
    
    const cacheAge = Date.now() - timestamp;
    if (cacheAge > CACHE_DURATION) {
        clearAllCache();
        return false;
    }
    
    return true;
}

function updateCacheTimestamp() {
    saveToCache(CACHE_KEYS.cacheTimestamp, Date.now());
}

// ========== تخزين كل البيانات ==========
function cacheAllData() {
    if (!resources || !me) return;
    
    // تخزين الموارد
    saveToCache(CACHE_KEYS.resources, {
        gold: resources.gold || 0,
        elixir: resources.elixir || 0,
        money: resources.money || 0,
        oil: resources.oil || 0
    });
    
    // تخزين بيانات المستخدم
    if (myData) {
        saveToCache(CACHE_KEYS.userData, {
            username: myData.username || 'مستخدم',
            userId: myData.userId || me.uid.slice(0, 6),
            email: myData.email || '',
            uid: me.uid,
            emoji: myData.emoji || '😎',
            avatarType: myData.avatarType || 'emoji',
            avatarUrl: myData.avatarUrl || '',
            bio: myData.bio || '',
            relationship: myData.relationship || 'اعزب',
            colors: myData.colors || {}
        });
    }
    
    // تخزين سجل العمليات
    if (transactions && transactions.length > 0) {
        const recentTransactions = [...transactions]
            .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
            .slice(0, 20);
        saveToCache(CACHE_KEYS.transactions, recentTransactions);
    }
    
    // تخزين طلبات السحب
    if (withdrawRequests && withdrawRequests.length > 0) {
        saveToCache(CACHE_KEYS.withdrawRequests, withdrawRequests.slice(0, 10));
    }
    
    // تخزين الوكلاء
    if (agents && agents.length > 0) {
        const agentsCache = agents.map(a => ({
            uid: a.uid,
            username: a.username,
            userId: a.userId,
            emoji: a.emoji,
            avatarType: a.avatarType,
            avatarUrl: a.avatarUrl,
            bio: a.bio,
            email: a.email
        }));
        saveToCache(CACHE_KEYS.agents, agentsCache);
    }
    
    // تخزين أسعار الصرف
    saveToCache(CACHE_KEYS.rates, RATES);
    
    // تخزين الإعدادات
    saveToCache(CACHE_KEYS.settings, {
        SELL_FEE: SELL_FEE,
        MIN_WITHDRAW: MIN_WITHDRAW,
        ALLOW_WITHDRAW: ALLOW_WITHDRAW
    });
    
    // تخزين المنشورات
    if (allPosts && allPosts.length > 0) {
        const postsCache = allPosts.slice(0, 30);
        saveToCache(CACHE_KEYS.allPosts, postsCache);
    }
    
    // تخزين بيانات الفريق
    if (teamMembers && teamMembers.length > 0) {
        saveToCache(CACHE_KEYS.teamData, {
            members: teamMembers.slice(0, 20),
            totalWithdrawals: teamTotalWithdrawals,
            totalEarnings: teamTotalEarnings,
            totalOilEarnings: teamTotalOilEarnings
        });
    }
    
    updateCacheTimestamp();
}

// ========== استرجاع وتطبيق البيانات المخزنة ==========
function applyCachedData() {
    if (!isCacheValid()) return false;
    
    // استرجاع الموارد
    const cachedResources = getFromCache(CACHE_KEYS.resources);
    if (cachedResources) {
        resources.gold = cachedResources.gold || 0;
        resources.elixir = cachedResources.elixir || 0;
        resources.money = cachedResources.money || 0;
        resources.oil = cachedResources.oil || 0;
    }
    
    // استرجاع بيانات المستخدم
    const cachedUser = getFromCache(CACHE_KEYS.userData);
    if (cachedUser) {
        myData = cachedUser;
    }
    
    // استرجاع أسعار الصرف
    const cachedRates = getFromCache(CACHE_KEYS.rates);
    if (cachedRates) {
        RATES = cachedRates;
    }
    
    // استرجاع الإعدادات
    const cachedSettings = getFromCache(CACHE_KEYS.settings);
    if (cachedSettings) {
        SELL_FEE = cachedSettings.SELL_FEE || 0.02;
        MIN_WITHDRAW = cachedSettings.MIN_WITHDRAW || 500;
        ALLOW_WITHDRAW = cachedSettings.ALLOW_WITHDRAW !== undefined ? cachedSettings.ALLOW_WITHDRAW : true;
    }
    
    // استرجاع سجل العمليات
    const cachedTransactions = getFromCache(CACHE_KEYS.transactions);
    if (cachedTransactions) {
        transactions = cachedTransactions;
    }
    
    // استرجاع طلبات السحب
    const cachedWithdraws = getFromCache(CACHE_KEYS.withdrawRequests);
    if (cachedWithdraws) {
        withdrawRequests = cachedWithdraws;
    }
    
    // استرجاع الوكلاء
    const cachedAgents = getFromCache(CACHE_KEYS.agents);
    if (cachedAgents) {
        agents = cachedAgents;
    }
    
    // استرجاع المنشورات
    const cachedPosts = getFromCache(CACHE_KEYS.allPosts);
    if (cachedPosts) {
        allPosts = cachedPosts;
    }
    
    // استرجاع بيانات الفريق
    const cachedTeam = getFromCache(CACHE_KEYS.teamData);
    if (cachedTeam) {
        teamMembers = cachedTeam.members || [];
        teamTotalWithdrawals = cachedTeam.totalWithdrawals || 0;
        teamTotalEarnings = cachedTeam.totalEarnings || 0;
        teamTotalOilEarnings = cachedTeam.totalOilEarnings || 0;
    }
    
    return true;
}

// ========== تعديل دوال التحميل الأصلية ==========

// تعديل loadData لحفظ البيانات تلقائياً بعد التحميل
const originalLoadData = loadData;
loadData = async function(uid) {
    // محاولة تحميل البيانات المخزنة أولاً
    const hasCachedData = applyCachedData();
    
    if (hasCachedData) {
        // عرض البيانات المخزنة فوراً (بدون أي مؤشرات)
        renderMain();
    }
    
    // تحميل البيانات الحية في الخلفية
    await originalLoadData(uid);
    
    // تحديث الكاش بالبيانات الجديدة
    cacheAllData();
    
    // إعادة عرض البيانات إذا كانت مختلفة (بدون أي إشعار)
    if (hasCachedData) {
        renderMain();
    }
};

// ========== مسح الكاش عند تسجيل الخروج ==========
const originalOnAuthStateChanged = onAuthStateChanged;
onAuthStateChanged(auth, async function(user) {
    if (!user) {
        clearAllCache();
    }
    
    // استدعاء الدالة الأصلية
    if (user) {
        me = user;
        await loadData(user.uid);
    } else {
        document.getElementById('mainContainer').innerHTML = '<p style="text-align:center;padding:50px;color:#94a3b8">يرجى تسجيل الدخول</p>';
    }
});
</script>
